<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="logo/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Little Symphony</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#C9A09A;--primary-dark:#A86860;--primary-xlight:#FBF9F9;
  --charcoal:#1C1C1E;--text-muted:#A09590;--border:#EDE6E3;
  --serif:'Playfair Display',serif;--sans:'Inter',sans-serif;
  --radius:16px;--radius-sm:10px;
}
body{font-family:var(--sans);background:#F5F0EE;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:2rem;
  -webkit-font-smoothing:antialiased}

.card{background:#fff;border-radius:20px;padding:2.5rem;width:100%;max-width:400px;
  box-shadow:0 8px 40px rgba(0,0,0,0.08)}

.logo-wrap{text-align:center;margin-bottom:2rem}
.logo-wrap img{height:44px;width:auto;margin:0 auto}

.admin-badge{display:inline-flex;align-items:center;gap:6px;
  background:#F5EDED;color:var(--primary-dark);
  font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;
  padding:5px 12px;border-radius:20px;margin-bottom:1.2rem}
.admin-badge svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

h1{font-family:var(--serif);font-size:1.6rem;margin-bottom:0.3rem;color:var(--charcoal)}
.sub{font-size:13px;color:var(--text-muted);margin-bottom:1.8rem}

.form-group{margin-bottom:1rem}
label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--charcoal)}
input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:14px;color:var(--charcoal);background:#fff;outline:none;
  transition:border-color 0.2s;font-family:var(--sans)}
input:focus{border-color:var(--primary)}

.error-msg{background:#FFF3F0;border:1px solid #FFCCC7;border-radius:8px;
  padding:10px 14px;font-size:13px;color:#C62828;display:none;margin-bottom:1rem}

.btn{width:100%;padding:14px;background:var(--charcoal);color:#fff;border:none;
  border-radius:40px;font-size:14px;font-weight:600;transition:all 0.25s;
  box-shadow:0 4px 16px rgba(0,0,0,0.15);margin-top:0.5rem}
.btn:hover{background:#3A3A3C;transform:translateY(-2px)}
.forgot{display:block;text-align:center;margin-top:1.2rem;font-size:13px;color:var(--primary-dark);background:none;border:none;cursor:pointer;font-family:var(--sans);width:100%}
.forgot:hover{text-decoration:underline}
.info-msg{background:#F1F8F1;border:1px solid #C8E6C9;border-radius:8px;padding:10px 14px;font-size:13px;color:#2E7D32;display:none;margin-top:1rem}

</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap"><img src="logo/logo.png" alt="Little Symphony"></div>
  <h1>Nouveau mot de passe</h1>
  <p class="sub" id="sub">Vérification du lien…</p>
  <div class="error-msg" id="error-msg"></div>
  <form id="form" onsubmit="savePassword(event)" style="display:none">
    <div class="form-group">
      <label>Nouveau mot de passe</label>
      <input type="password" id="pw1" minlength="8" autocomplete="new-password" required>
    </div>
    <div class="form-group">
      <label>Confirmer le mot de passe</label>
      <input type="password" id="pw2" minlength="8" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn">Enregistrer →</button>
  </form>
  <div class="info-msg" id="info-msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
const showErr = m => { const e = document.getElementById('error-msg'); e.textContent = m; e.style.display = 'block'; };
function ready() {
  document.getElementById('sub').textContent = 'Choisis un nouveau mot de passe (8 caractères minimum).';
  document.getElementById('form').style.display = 'block';
}
_supabase.auth.onAuthStateChange((event, session) => { if (session) ready(); });
setTimeout(async () => {
  const { data: { session } } = await _supabase.auth.getSession();
  if (session) ready();
  else document.getElementById('sub').textContent = "Lien invalide ou expiré. Redemande un e-mail depuis la page de connexion admin.";
}, 1500);

async function savePassword(e) {
  e.preventDefault();
  document.getElementById('error-msg').style.display = 'none';
  const pw1 = document.getElementById('pw1').value, pw2 = document.getElementById('pw2').value;
  if (pw1 !== pw2) return showErr('Les deux mots de passe ne sont pas identiques.');
  const btn = document.querySelector('.btn'); btn.disabled = true; btn.textContent = 'Enregistrement…';
  const { error } = await _supabase.auth.updateUser({ password: pw1 });
  btn.disabled = false; btn.textContent = 'Enregistrer →';
  if (error) return showErr('Erreur : ' + error.message);
  await _supabase.auth.signOut();
  document.getElementById('form').style.display = 'none';
  const info = document.getElementById('info-msg'); info.style.display = 'block';
  info.textContent = 'Mot de passe modifié. Redirection vers la connexion admin…';
  setTimeout(() => window.location.href = 's-admin.html', 2000);
}
</script>
</body>
</html>
