<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="logo/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Nouveau mot de passe — Little Symphony</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#C9A09A;--primary-dark:#A86860;--primary-xlight:#FBF9F9;
  --charcoal:#1C1C1E;--text-muted:#A09590;--border:#EDE6E3;
  --serif:'Playfair Display',serif;--sans:'Inter',sans-serif;
  --radius:16px;--radius-sm:10px;
}
body{font-family:var(--sans);background:#F5F0EE;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:2rem;
  -webkit-font-smoothing:antialiased}

.card{background:#fff;border-radius:20px;padding:2.5rem;width:100%;max-width:400px;
  box-shadow:0 8px 40px rgba(0,0,0,0.08)}

.logo-wrap{text-align:center;margin-bottom:2rem}
.logo-wrap img{height:44px;width:auto;margin:0 auto;display:block}
.logo-wrap a{display:inline-block}

.admin-badge{display:inline-flex;align-items:center;gap:6px;
  background:#F5EDED;color:var(--primary-dark);
  font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;
  padding:5px 12px;border-radius:20px;margin-bottom:1.2rem}
.admin-badge svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

h1{font-family:var(--serif);font-size:1.6rem;margin-bottom:0.3rem;color:var(--charcoal)}
.sub{font-size:13px;color:var(--text-muted);margin-bottom:1.8rem}

.form-group{margin-bottom:1rem}
label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--charcoal)}
input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:14px;color:var(--charcoal);background:#fff;outline:none;
  transition:border-color 0.2s;font-family:var(--sans)}
input:focus{border-color:var(--primary)}

.error-msg{background:#FFF3F0;border:1px solid #FFCCC7;border-radius:8px;
  padding:10px 14px;font-size:13px;color:#C62828;display:none;margin-bottom:1rem}

.btn{width:100%;padding:14px;background:var(--charcoal);color:#fff;border:none;
  border-radius:40px;font-size:14px;font-weight:600;transition:all 0.25s;
  box-shadow:0 4px 16px rgba(0,0,0,0.15);margin-top:0.5rem}
.btn:hover{background:#3A3A3C;transform:translateY(-2px)}
.forgot{display:block;text-align:center;margin-top:1.2rem;font-size:13px;color:var(--primary-dark);background:none;border:none;cursor:pointer;font-family:var(--sans);width:100%}
.forgot:hover{text-decoration:underline}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:46px}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);display:flex;cursor:pointer;padding:4px}
.eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hint{font-size:12px;color:var(--text-muted);margin-top:6px}
.btn:disabled{opacity:.7;transform:none;cursor:default}
.btn{cursor:pointer}
.link-btn{display:block;text-align:center;margin-top:1.2rem;font-size:13px;color:var(--primary-dark);text-decoration:none}
.link-btn:hover{text-decoration:underline}
.info-msg{background:#F1F8F1;border:1px solid #C8E6C9;border-radius:8px;padding:10px 14px;font-size:13px;color:#2E7D32;display:none;margin-top:1rem}

</style>
</head>
<body>
<div class="card">
  <div class="logo-wrap"><a href="index.html"><img src="logo/logo.png" alt="Little Symphony"></a></div>
  <h1>Nouveau mot de passe</h1>
  <p class="sub" id="sub">Vérification du lien…</p>
  <div class="error-msg" id="error-msg"></div>
  <form id="form" onsubmit="savePassword(event)" style="display:none">
    <div class="form-group">
      <label for="pw1">Nouveau mot de passe</label>
      <div class="pw-wrap">
        <input type="password" id="pw1" minlength="8" autocomplete="new-password" required>
        <button type="button" class="eye" onclick="togglePw()" aria-label="Afficher le mot de passe"><svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <p class="hint">8 caractères minimum.</p>
    </div>
    <div class="form-group">
      <label for="pw2">Confirmer le mot de passe</label>
      <input type="password" id="pw2" minlength="8" autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn">Enregistrer</button>
  </form>
  <a class="link-btn" id="again-link" href="login.html#oubli" style="display:none">Recevoir un nouveau lien</a>
  <div class="info-msg" id="info-msg"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
const showErr = m => { const e = document.getElementById('error-msg'); e.textContent = m; e.style.display = 'block'; };
function togglePw() {
  ['pw1','pw2'].forEach(id => { const el = document.getElementById(id); el.type = el.type === 'password' ? 'text' : 'password'; });
}
let _ready = false;
function ready() {
  if (_ready) return; _ready = true;
  document.getElementById('sub').textContent = 'Choisissez votre nouveau mot de passe.';
  document.getElementById('form').style.display = 'block';
  document.getElementById('again-link').style.display = 'none';
  setTimeout(() => document.getElementById('pw1').focus(), 50);
}
function expired() {
  if (_ready) return;
  document.getElementById('sub').textContent = "Ce lien n'est plus valide : il a expiré ou a déjà été utilisé. Demandez un nouvel e-mail, puis cliquez sur le lien le plus récent.";
  document.getElementById('again-link').style.display = 'block';
}
// Lien expiré / déjà utilisé : Supabase renvoie l'erreur dans l'adresse
const _h = new URLSearchParams(location.hash.slice(1)), _q = new URLSearchParams(location.search);
const _linkError = _h.get('error') || _q.get('error') || _h.get('error_code') || _q.get('error_code');

_supabase.auth.onAuthStateChange((event, session) => { if (session && !_linkError) ready(); });
setTimeout(async () => {
  if (_linkError) return expired();
  const { data: { session } } = await _supabase.auth.getSession();
  if (session) ready(); else expired();
}, 1500);

async function savePassword(e) {
  e.preventDefault();
  document.getElementById('error-msg').style.display = 'none';
  const pw1 = document.getElementById('pw1').value, pw2 = document.getElementById('pw2').value;
  if (pw1.length < 8) return showErr('Le mot de passe doit contenir au moins 8 caractères.');
  if (pw1 !== pw2) return showErr('Les deux mots de passe ne sont pas identiques.');
  const btn = document.querySelector('.btn'); btn.disabled = true; btn.textContent = 'Enregistrement…';
  const { data: u } = await _supabase.auth.getUser();
  const { error } = await _supabase.auth.updateUser({ password: pw1 });
  btn.disabled = false; btn.textContent = 'Enregistrer';
  if (error) {
    const m = String(error.message || '');
    if (/different from the old/i.test(m)) return showErr("Le nouveau mot de passe doit être différent de l'ancien.");
    if (/weak|short|at least/i.test(m)) return showErr('Mot de passe trop faible : utilisez au moins 8 caractères, avec lettres et chiffres.');
    if (/session|expired|jwt/i.test(m)) { expired(); document.getElementById('form').style.display = 'none'; return; }
    return showErr("L'enregistrement a échoué. Merci de réessayer.");
  }
  // Admin → connexion admin ; client → page de connexion de la boutique
  let isAdmin = false;
  try {
    if (u?.user) {
      const { data: p } = await _supabase.from('profiles').select('role').eq('id', u.user.id).single();
      isAdmin = p?.role === 'admin';
    }
  } catch (_) {}
  await _supabase.auth.signOut();
  document.getElementById('form').style.display = 'none';
  document.getElementById('sub').textContent = '';
  const info = document.getElementById('info-msg'); info.style.display = 'block';
  info.textContent = 'Mot de passe modifié ! Redirection vers la connexion…';
  setTimeout(() => window.location.href = isAdmin ? 's-admin.html' : 'login.html?reset=ok', 1800);
}
</script>
</body>
</html>
