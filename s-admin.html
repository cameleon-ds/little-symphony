<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="logo/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin — Little Symphony</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#C9A09A;--primary-dark:#A86860;--primary-xlight:#FBF9F9;
  --charcoal:#1C1C1E;--text-muted:#A09590;--border:#EDE6E3;
  --serif:'Playfair Display',serif;--sans:'Inter',sans-serif;
  --radius:16px;--radius-sm:10px;
}
body{font-family:var(--sans);background:#F5F0EE;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:2rem;
  -webkit-font-smoothing:antialiased}

.card{background:#fff;border-radius:20px;padding:2.5rem;width:100%;max-width:400px;
  box-shadow:0 8px 40px rgba(0,0,0,0.08)}

.logo-wrap{text-align:center;margin-bottom:2rem}
.logo-wrap img{height:44px;width:auto;margin:0 auto}

.admin-badge{display:inline-flex;align-items:center;gap:6px;
  background:#F5EDED;color:var(--primary-dark);
  font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;
  padding:5px 12px;border-radius:20px;margin-bottom:1.2rem}
.admin-badge svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

h1{font-family:var(--serif);font-size:1.6rem;margin-bottom:0.3rem;color:var(--charcoal)}
.sub{font-size:13px;color:var(--text-muted);margin-bottom:1.8rem}

.form-group{margin-bottom:1rem}
label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--charcoal)}
input{width:100%;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:14px;color:var(--charcoal);background:#fff;outline:none;
  transition:border-color 0.2s;font-family:var(--sans)}
input:focus{border-color:var(--primary)}

.error-msg{background:#FFF3F0;border:1px solid #FFCCC7;border-radius:8px;
  padding:10px 14px;font-size:13px;color:#C62828;display:none;margin-bottom:1rem}

.btn{width:100%;padding:14px;background:var(--charcoal);color:#fff;border:none;
  border-radius:40px;font-size:14px;font-weight:600;transition:all 0.25s;
  box-shadow:0 4px 16px rgba(0,0,0,0.15);margin-top:0.5rem}
.btn:hover{background:#3A3A3C;transform:translateY(-2px)}
.forgot{display:none;text-align:center;margin-top:1.2rem;font-size:13px;color:var(--primary-dark);background:none;border:none;cursor:pointer;font-family:var(--sans);width:100%}
.forgot:hover{text-decoration:underline}
.info-msg{background:#F1F8F1;border:1px solid #C8E6C9;border-radius:8px;padding:10px 14px;font-size:13px;color:#2E7D32;display:none;margin-top:1rem}

</style>
</head>
<body>

<div class="card">
  <div class="logo-wrap">
    <img src="logo/logo.png" alt="Little Symphony">
  </div>

  <div style="text-align:center">
    <div class="admin-badge">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      Espace administrateur
    </div>
  </div>

  <h1>Connexion admin</h1>
  <p class="sub">Accès réservé à l'équipe Little Symphony</p>

  <div class="error-msg" id="error-msg"></div>

  <form id="login-form" onsubmit="sendLink(event)">
    <div class="form-group">
      <label for="email">Login</label>
      <input type="email" id="email" placeholder="votre adresse e-mail" autocomplete="email" inputmode="email" required>
    </div>
    <button type="submit" class="btn" id="btn-continue">Continuer →</button>
  </form>
  <div class="info-msg" id="info-msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script>
// Si déjà connecté admin → rediriger directement
(async () => {
  const { data: { session } } = await _supabase.auth.getSession();
  if (session) {
    const { data: role } = await _supabase.rpc('get_my_role');
    if (role === 'admin') { window.location.href = 'admin-panel.html'; return; }
  }
})();

// Connexion par lien e-mail (sans mot de passe). Le message est toujours le même,
// que l'adresse soit autorisée ou non : la page ne révèle jamais quelles adresses ont accès.
// Les droits admin sont vérifiés par la base (liste blanche de 2 adresses).
async function sendLink(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const btn = document.getElementById('btn-continue');
  const info = document.getElementById('info-msg');
  const err = document.getElementById('error-msg');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Envoi…';
  // L'e-mail n'est envoyé que si l'adresse est admin : la vérification se fait côté serveur
  // (fonction Supabase « admin-login »), la liste des adresses n'est jamais dans la page.
  const { error } = await _supabase.functions.invoke('admin-login', {
    body: { email, redirectTo: new URL('admin-panel.html', window.location.href).href }
  });
  btn.disabled = false; btn.textContent = 'Continuer →';
  if (error) {
    err.textContent = "Envoi impossible pour le moment. Merci de réessayer dans un instant.";
    err.style.display = 'block';
    return;
  }
  document.getElementById('login-form').style.display = 'none';
  info.style.display = 'block';
  info.innerHTML = "Si cette adresse est autorisée, un lien de connexion vient de lui être envoyé.<br>Il est valable 10 minutes et ne fonctionne qu'une seule fois.";
}
</script>
</body>
</html>
