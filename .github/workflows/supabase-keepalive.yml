# Garde la base Supabase active (le plan gratuit se met en pause apres 7 jours d'inactivite).
# Lit 1 produit chaque jour via l'API publique, avec la cle publique deja presente dans supabase-client.js.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *'   # tous les jours a 06:17 UTC
  workflow_dispatch:        # lancement manuel possible depuis l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -o "https://[a-z0-9]*\.supabase\.co" supabase-client.js | head -1)
          KEY=$(grep -o "eyJ[A-Za-z0-9._-]*" supabase-client.js | head -1)
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase a repondu : $CODE"
          [ "$CODE" = "200" ]
