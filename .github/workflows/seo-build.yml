# Génère les pages produit statiques + sitemap.xml (référencement Google, aperçus WhatsApp/Facebook).
# Tourne toutes les 6 h, à chaque modification du modèle de fiche produit, ou à la main (onglet Actions > Run workflow).
name: SEO - pages produit et sitemap

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['product.html', 'scripts/build-seo.mjs']

permissions:
  contents: write
  pages: write

concurrency: { group: seo-build, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Générer les pages
        run: node scripts/build-seo.mjs
      - name: Publier si quelque chose a changé
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A produit sitemap.xml
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "SEO: mise a jour des pages produit et du sitemap"
          git pull --rebase origin main
          git push
          # Les pushs faits par GITHUB_TOKEN ne relancent pas GitHub Pages : on demande la publication
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
